###############改名字##############
name: Redmi-AX6000-immortalwrt-25.12

on:
  workflow_dispatch:
  repository_dispatch:
#  push:
#  schedule:
#    - cron: 0 16 * * *

permissions:
  contents: write

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: immortalwrt-25.12/Redmi-AX6000/.config
  DIY_P1_SH: immortalwrt-25.12/Redmi-AX6000/diy-part1.sh
  DIY_P2_SH: immortalwrt-25.12/Redmi-AX6000/diy-part2.sh
  SSH_ACTIONS: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  ###############改名字##############
  OPENWRT_NAME: 25.12

jobs:
  build:
    # 需要 ubuntu-22.04 / ubuntu-24.04 也可以，改成对应标签即可
    runs-on: ubuntu-latest

    steps:
    - name: 检查项目分支
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        # 必需依赖（装不上就直接失败）
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ g++-multilib gcc-multilib \
          gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip \
          zlib1g-dev file wget bc cpio python3-pyelftools libelf-dev time diffutils patch xz-utils ccache zstd
        # 可选依赖（个别发行版没这些包，装不上不影响编译）
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bzip2 \
          cmake device-tree-compiler fastjar gperf haveged help2man intltool libc6-dev-i386 libfuse-dev \
          libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libpython3-dev libreadline-dev \
          libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full pkgconf qemu-utils scons \
          squashfs-tools subversion texinfo uglifyjs upx-ucl xmlto xxd || echo "可选依赖部分安装失败，忽略"
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 下载固件源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH --depth 1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载feeds.conf.default & DIY_P1_SH
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 & 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载config & DIY_P2_SH
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH链接管理
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载安装包
      id: package
      run: |
        cd openwrt
        make defconfig
        # 关键校验：设备配置和闭源驱动一旦被 defconfig 吃掉，直接中断，避免白编 3 小时
        grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=y' .config \
          || { echo "::error::目标设备 xiaomi_redmi-router-ax6000-mtkuboot 未生效"; exit 1; }
        grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y' .config \
          || { echo "::error::闭源驱动 kmod-mt_wifi 未生效"; exit 1; }
        grep -q '^CONFIG_MTK_WIFI_SKU_TYPE="AX6000"' .config \
          || { echo "::error::MTK_WIFI_SKU_TYPE 不是 AX6000"; exit 1; }
        grep -E '^(CONFIG_MTK_MT_WIFI_DRIVER_VERSION_.*|CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986.*)=' .config || true
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*TARGET_.*_(.*)_DEVICE_.*=y/\1/' > TARGET_NAME
        [ -s TARGET_NAME ] && echo "TARGET_NAME=$(cat TARGET_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件并重命名
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        sudo -E apt-get -qq install -y rename
        rename 's/.*${{ env.TARGET_NAME }}/${{ env.FILE_DATE }}-${{ env.OPENWRT_NAME }}/' *
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到github
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.FILE_DATE }}-${{ env.OPENWRT_NAME }}-${{ env.DEVICE_NAME }}
        path: ${{ env.FIRMWARE }}
        compression-level: 0

    - name: 生成release标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ env.FILE_DATE }}-${{ env.OPENWRT_NAME }}-${{ env.DEVICE_NAME }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "由衷感谢所有为openwrt无私奉献的大佬们" >> release.txt
        echo "" >> release.txt
        echo "- 源码：chasey-dev/immortalwrt-mt798x-rebase @ 25.12（内核 6.12 + MTK 闭源驱动）" >> release.txt
        echo "- 设备：Redmi AX6000 **110MB / MTK U-Boot 布局**（hanwckf 不死 uboot）" >> release.txt
        echo "- 与 stock / ubootmod 布局不通用，刷错必砖" >> release.txt
        echo "- 从 21.02 跨版本升级会被 board 校验拦截，需在 uboot web 里刷 factory.bin" >> release.txt
        echo "📥 固件下载" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布至release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.FILE_DATE }}-${{ env.OPENWRT_NAME }}-${{ env.DEVICE_NAME }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
